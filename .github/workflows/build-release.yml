name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW (WinLibs)
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip"
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          $dest = "$env:RUNNER_TEMP\winlibs"

          Write-Host "Downloading WinLibs GCC..."
          curl.exe -L --retry 3 --fail -o $zip $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Download failed"; exit 1 }

          # tar (bsdtar) is ~20x faster than Expand-Archive on this archive.
          Write-Host "Extracting..."
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          tar.exe -xf $zip -C $dest
          if ($LASTEXITCODE -ne 0) { Write-Error "Extraction failed"; exit 1 }

          # The archive contains a top-level "mingw64" folder; resolve gcc.exe by
          # searching instead of assuming the depth.
          $gcc = Get-ChildItem $dest -Recurse -Filter gcc.exe -File |
                 Where-Object { $_.DirectoryName -like "*\bin" } | Select-Object -First 1
          if (-not $gcc) { Write-Error "gcc.exe not found in WinLibs archive"; exit 1 }

          $gccBin = $gcc.DirectoryName
          Write-Host "GCC bin: $gccBin"
          & "$gccBin\gcc.exe" --version | Select-Object -First 1

          "MINGW_BIN=$gccBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify vendored dependencies
        run: |
          $required = @(
            "vendor\imgui\imgui.cpp",
            "vendor\imgui\backends\imgui_impl_sdl2.cpp",
            "vendor\imgui\backends\imgui_impl_opengl3.cpp",
            "vendor\stb\stb_image.h",
            "vendor\SDL2-2.32.10\x86_64-w64-mingw32\lib\libSDL2.a",
            "vendor\SDL2-2.32.10\x86_64-w64-mingw32\lib\libSDL2main.a",
            "vendor\SDL2-2.32.10\x86_64-w64-mingw32\bin\SDL2.dll",
            "vendor\SDL2-2.32.10\x86_64-w64-mingw32\include\SDL2\SDL.h",
            "assets\rocket.gif", "assets\clouds.gif", "assets\beach.gif"
          )
          $missing = @()
          foreach ($f in $required) { if (-not (Test-Path $f)) { $missing += $f } }
          if ($missing.Count -gt 0) {
            Write-Error ("Missing vendored files:`n  " + ($missing -join "`n  "))
            exit 1
          }
          Write-Host "All vendored dependencies present."

      - name: Configure CMake (MinGW)
        run: |
          # CMake writes the RC compiler path into a .cmake file without
          # escaping, so Windows backslashes must be converted to slashes.
          $gcc = $env:MINGW_BIN -replace '\\', '/'
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER="$gcc/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$gcc/g++.exe" `
            -DCMAKE_RC_COMPILER="$gcc/windres.exe" `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build output
        run: |
          $exe = "build\bin\Pomodoro.exe"
          if (-not (Test-Path $exe)) { Write-Error "Pomodoro.exe not found at $exe"; exit 1 }
          $bytes = (Get-Item $exe).Length
          Write-Host "Found: $exe ($bytes bytes)"
          foreach ($f in @("build\bin\SDL2.dll", "build\bin\assets\rocket.gif")) {
            if (-not (Test-Path $f)) { Write-Error "Missing bundled runtime file: $f"; exit 1 }
          }
          # PE subsystem must be 2 (Windows GUI) -> no console window
          $fs = [IO.File]::OpenRead((Resolve-Path $exe))
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4 + 20 + 68
          $subsystem = $br.ReadUInt16()
          $br.Close()
          Write-Host "PE subsystem: $subsystem (2 = GUI)"
          if ($subsystem -ne 2) { Write-Error "Not a GUI subsystem binary (no-console requirement)"; exit 1 }

      - name: Package release zip
        run: |
          $ver = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "dev" }
          $zipName = "Pomodoro-v1.0.0-win64.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "build\bin\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName ($((Get-Item $zipName).Length) bytes)"
          "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-win64
          path: ${{ env.RELEASE_ZIP }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Pomodoro ${{ github.ref_name }}
          body: |
            ## Pomodoro ${{ github.ref_name }} — Windows 64-bit

            ### Install (no setup, no deps)
            1. Download **`Pomodoro-v1.0.0-win64.zip`** below
            2. Extract anywhere (e.g. `C:\Tools\Pomodoro\`)
            3. Run **`Pomodoro.exe`**

            The zip is self-contained: `Pomodoro.exe` + `SDL2.dll` + `assets\`.
            Nothing to install, no Visual C++ redistributable needed (MinGW
            runtime is statically linked).

            ### Highlights
            - Floating, borderless, always-on-top mini widget (rocket / clouds / beach GIF per phase)
            - Full app view with settings, session dots, progress bar
            - Global hotkey `Ctrl+Alt+P` = start/pause
            - Settings persisted to `settings.ini` next to the exe

            Full details in the [README](https://github.com/${{ github.repository }}#readme).
          files: ${{ env.RELEASE_ZIP }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
